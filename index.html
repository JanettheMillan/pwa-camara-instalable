<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cámara de Evidencias</title>
  <link rel="stylesheet" href="./styles.css">
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
</head>
<body>
  <header>
    <h1>Cámara de Evidencias</h1>
    <p>Janetthe Millán</p>
  </header>

  <main>
    <button id="btn-instalar" hidden>Instalar en mi teléfono</button>

    <p id="instrucciones-ios" class="caja" hidden>
      Para instalar en iPhone, pulsa el icono Compartir y selecciona "Agregar a inicio".
    </p>

    <video id="visor-camara" autoplay playsinline muted></video>

    <p id="mensaje-estado">Cámara apagada.</p>

    <button id="btn-preparar-camara">Usar la cámara</button>

    <div id="aviso-permiso" class="caja" hidden>
      <p>Esta aplicación requiere acceso a tu cámara únicamente para mostrar una vista previa local en pantalla. Ninguna imagen se envía a servidores externos.</p>
      <button id="btn-confirmar-permiso">Entendido, encender cámara</button>
    </div>

    <div id="controles" hidden>
      <button id="btn-alternar-camara">Girar cámara</button>
      <button id="btn-apagar-camara">Apagar</button>
    </div>
  </main>

  <script src="./app.js"></script>
</body>
</html>
